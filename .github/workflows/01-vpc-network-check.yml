name: VPC lab Terraform validation

on:
  push:
    paths:
      - "projects/01-vpc-network/**"
      - ".github/workflows/01-vpc-network-check.yml"
  pull_request:
    paths:
      - "projects/01-vpc-network/**"
      - ".github/workflows/01-vpc-network-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Format and validate VPC lab
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/01-vpc-network
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Initialize providers without a backend
        run: terraform init -backend=false -lockfile=readonly
      - name: Validate configuration
        run: terraform validate
